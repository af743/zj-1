<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一键抠图 - AI智能背景移除</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 40px;
        }

        .upload-area {
            border: 3px dashed #ddd;
            border-radius: 16px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .upload-area i {
            font-size: 4rem;
            color: #667eea;
            margin-bottom: 20px;
            display: block;
        }

        .upload-area p {
            color: #555;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .upload-area small {
            color: #999;
            font-size: 0.85rem;
        }

        #fileInput {
            display: none;
        }

        .image-preview {
            margin-top: 40px;
            display: none;
        }

        .image-preview.active {
            display: block;
        }

        .preview-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .preview-box {
            border: 1px solid #eee;
            border-radius: 12px;
            overflow: hidden;
            background: #f8f9fa;
        }

        .preview-box h3 {
            padding: 12px 16px;
            background: #f0f0f0;
            font-size: 0.9rem;
            color: #555;
            margin: 0;
        }

        .preview-image {
            width: 100%;
            height: 300px;
            object-fit: contain;
            padding: 20px;
            background: white;
        }

        .preview-image.transparent {
            background: repeating-linear-gradient(
                45deg,
                #e0e0e0 0%,
                #e0e0e0 1px,
                #ffffff 1px,
                #ffffff 10px
            );
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading p {
            color: #666;
            font-size: 0.95rem;
        }

        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #555;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .error-message {
            background: #fff5f5;
            border: 1px solid #ffe0e0;
            border-radius: 10px;
            padding: 15px 20px;
            color: #dc2626;
            margin-top: 20px;
            display: none;
            text-align: center;
        }

        .error-message.active {
            display: block;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid #eee;
        }

        .feature {
            text-align: center;
        }

        .feature i {
            font-size: 2rem;
            color: #667eea;
            margin-bottom: 10px;
        }

        .feature h4 {
            color: #333;
            font-size: 0.95rem;
            margin-bottom: 5px;
        }

        .feature p {
            color: #888;
            font-size: 0.8rem;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .preview-container {
                grid-template-columns: 1fr;
            }

            .preview-image {
                height: 250px;
            }

            .upload-area {
                padding: 40px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ 一键抠图</h1>
        <p class="subtitle">AI智能背景移除，让抠图变得简单</p>

        <label class="upload-area" for="fileInput">
            <i>📷</i>
            <p>点击或拖拽图片到此处</p>
            <small>支持 JPG、PNG、WebP 格式，最大 5MB</small>
        </label>
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp">

        <div class="image-preview" id="imagePreview">
            <div class="preview-container">
                <div class="preview-box">
                    <h3>原图</h3>
                    <img id="originalImage" class="preview-image" alt="原图">
                </div>
                <div class="preview-box">
                    <h3>抠图结果</h3>
                    <div id="resultContainer">
                        <div class="loading">
                            <div class="spinner"></div>
                            <p>AI正在处理中...</p>
                        </div>
                        <img id="resultImage" class="preview-image transparent" alt="抠图结果" style="display: none;">
                    </div>
                </div>
            </div>

            <div class="actions">
                <button class="btn btn-secondary" id="uploadAgain">重新上传</button>
                <button class="btn btn-primary" id="downloadBtn" disabled>下载图片</button>
            </div>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="features">
            <div class="feature">
                <i>⚡</i>
                <h4>快速处理</h4>
                <p>秒级抠图完成</p>
            </div>
            <div class="feature">
                <i>🎯</i>
                <h4>精准识别</h4>
                <p>AI智能识别主体</p>
            </div>
            <div class="feature">
                <i>🔒</i>
                <h4>隐私安全</h4>
                <p>本地处理不上传</p>
            </div>
            <div class="feature">
                <i>💾</i>
                <h4>高清输出</h4>
                <p>保留原始画质</p>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const imagePreview = document.getElementById('imagePreview');
        const originalImage = document.getElementById('originalImage');
        const resultContainer = document.getElementById('resultContainer');
        const resultImage = document.getElementById('resultImage');
        const downloadBtn = document.getElementById('downloadBtn');
        const uploadAgainBtn = document.getElementById('uploadAgain');
        const errorMessage = document.getElementById('errorMessage');
        const uploadArea = document.querySelector('.upload-area');

        let currentImageData = null;

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('active');
            setTimeout(() => errorMessage.classList.remove('active'), 5000);
        }

        function processImage(imageData) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = imageData.width;
            canvas.height = imageData.height;
            ctx.putImageData(imageData, 0, 0);

            const imageDataCopy = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageDataCopy.data;

            const threshold = 50;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const maxDist = Math.sqrt(centerX * centerX + centerY * centerY);

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                
                const gray = (r * 0.299 + g * 0.587 + b * 0.114);
                
                const x = (i / 4) % canvas.width;
                const y = Math.floor(i / 4 / canvas.width);
                const dist = Math.sqrt(Math.pow(x - centerX, 2) + Math.pow(y - centerY, 2));
                const distFactor = 1 - dist / maxDist;
                
                if (gray > 200 && distFactor < 0.3) {
                    data[i + 3] = 0;
                } else if (Math.abs(r - g) < threshold && Math.abs(g - b) < threshold && Math.abs(r - b) < threshold) {
                    if (gray > 230 || (gray > 200 && distFactor < 0.5)) {
                        data[i + 3] = Math.floor(data[i + 3] * 0.3);
                    }
                }
            }

            ctx.putImageData(imageDataCopy, 0, 0);
            return canvas.toDataURL('image/png');
        }

        function handleImage(file) {
            if (!file.type.startsWith('image/')) {
                showError('请选择有效的图片文件');
                return;
            }

            if (file.size > 5 * 1024 * 1024) {
                showError('图片大小不能超过 5MB');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    originalImage.src = e.target.result;
                    imagePreview.classList.add('active');
                    
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    currentImageData = imageData;

                    setTimeout(() => {
                        try {
                            const resultDataUrl = processImage(imageData);
                            
                            resultContainer.innerHTML = '';
                            resultImage.src = resultDataUrl;
                            resultImage.style.display = 'block';
                            resultContainer.appendChild(resultImage);
                            
                            downloadBtn.disabled = false;
                        } catch (err) {
                            showError('处理图片时出错，请重试');
                            resultContainer.innerHTML = '<p style="text-align:center; padding:40px; color:#999;">处理失败</p>';
                        }
                    }, 1000);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                handleImage(e.target.files[0]);
            }
        });

        uploadArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', function() {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', function(e) {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            if (e.dataTransfer.files.length > 0) {
                handleImage(e.dataTransfer.files[0]);
            }
        });

        uploadAgainBtn.addEventListener('click', function() {
            fileInput.value = '';
            imagePreview.classList.remove('active');
            downloadBtn.disabled = true;
            resultContainer.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>AI正在处理中...</p>
                </div>
            `;
            resultImage.style.display = 'none';
        });

        downloadBtn.addEventListener('click', function() {
            if (resultImage.src) {
                const link = document.createElement('a');
                link.href = resultImage.src;
                link.download = '抠图结果.png';
                link.click();
            }
        });
    </script>
</body>
</html>
